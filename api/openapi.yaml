      responses: { '202': { description: Verified import job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /role-transitions:
    post:
      operationId: startRoleTransition
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleTransitionRequest' } } } }
      responses: { '202': { description: Preflighted role-transition job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /audit-events:
    get:
      operationId: listAuditEvents
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { name: target_id, in: query, schema: { type: string, maxLength: 128 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Redacted audit-event page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: payesh_session
      description: Secure, HttpOnly, SameSite session cookie.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Per-session token required on browser-originated mutations.
  parameters:
    ServerID:
      name: serverId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
    From:
      name: from
      in: query
      required: true
      description: UTC start; range must be no longer than 31 days.
      schema: { type: string, format: date-time }
      x-max-duration: P31D
    To:
      name: to
      in: query
      required: true
      description: UTC end; range must be no longer than 31 days.
      schema: { type: string, format: date-time }
      x-max-duration: P31D
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable operation identity used for safe retries.
      schema: { type: string, minLength: 1, maxLength: 128 }
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token issued with the authenticated session.
      schema: { type: string, minLength: 16, maxLength: 256 }
    ModuleID:
      name: moduleId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PolicyID:
      name: policyId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    Conflict: { description: State or revision conflict, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    ServiceUnavailable: { description: 'The source or derived data is temporarily unavailable; retry later.', content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    TooManyRequests:
      description: 'Login attempts are throttled. The API error uses code auth.rate_limited and retryable true.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
  headers:
    RetryAfter:
      description: Whole seconds to wait before the next login attempt.
      schema: { type: integer, minimum: 1, maximum: 3600 }
  schemas:
    SetupRequest:
      type: object
      required: [setup_secret, password]
      properties:
        setup_secret: { type: string, minLength: 16, writeOnly: true }
        password: { type: string, minLength: 12, writeOnly: true }
    LoginRequest:
      type: object
      required: [password]
      properties: { password: { type: string, writeOnly: true } }
    Server:
      type: object
      required: [id, name, role, architecture, platform, capabilities, connection_state, freshness_state, configuration_revision]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, enum: [standalone, hub, node, cli-only] }
        architecture: { type: string, enum: [amd64, arm64] }
        platform: { type: string }
        capabilities: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } }
        version: { type: string }
        last_heartbeat: { type: string, format: date-time, nullable: true }
        connection_state: { type: string, enum: [connected, disconnected, never-connected, revoked] }
        freshness_state: { type: string, enum: [fresh, stale, unknown] }
        freshness_reason: { type: string, maxLength: 256 }
        configuration_revision: { $ref: '#/components/schemas/DecimalUint64' }
    ServerLabelUpdateRequest:
      type: object
      required: [name, expected_revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { $ref: '#/components/schemas/DecimalUint64' }
    ServerPage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Server' } }, next_cursor: { type: string, maxLength: 256 } }
    AuditEvent:
      type: object
      required: [id, occurred_at, actor_type, action, target_type, result, revision, redacted]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string, enum: [owner, node, local-cli, system] }
        actor_id: { type: string, maxLength: 128 }
        action: { type: string, minLength: 1, maxLength: 128 }
        target_type: { type: string, enum: [server, module, policy, release, backup, role-transition] }
        target_id: { type: string, maxLength: 128 }
        result: { type: string, enum: [succeeded, failed, denied] }
        revision: { $ref: '#/components/schemas/DecimalUint64' }
        redacted: { type: boolean }
        correlation_id: { type: string, maxLength: 128 }
    AuditEventPage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AuditEvent' } }, next_cursor: { type: string, maxLength: 256 } }
    DecimalUint64:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-5])$'
      description: Unsigned 64-bit integer encoded as decimal; values must be <= 18446744073709551615.
      x-max-value: '18446744073709551615'
    Rollup:
      type: object
      required: [server_id, metric, bucket_start, bucket_seconds, sample_count, observed_seconds, coverage]
      properties:
        server_id: { type: string, minLength: 16, maxLength: 128 }
        metric: { type: string, minLength: 1, maxLength: 128 }
        bucket_start: { type: string, format: date-time }
        bucket_seconds: { type: integer, enum: [60, 3600] }
        sample_count: { type: integer, minimum: 1, maximum: 1000000 }
        observed_seconds: { type: number, minimum: 0 }
        minimum: { type: number, nullable: true }
        maximum: { type: number, nullable: true }
        weighted_mean: { type: number, nullable: true }
        counter_delta: { $ref: '#/components/schemas/DecimalUint64' }
        coverage: { type: string, enum: [complete, gap, uncertain] }
    MetricQuery:
      type: object
      required: [samples, rollups, coverage]
      properties:
        samples: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/MetricSample' } }
        rollups: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Rollup' } }
        coverage: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        gaps: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CoverageGap' } }
        next_cursor: { type: string, maxLength: 256 }
        gaps_next_cursor: { type: string, maxLength: 256 }
        truncated: { type: boolean }
    MetricSample:
      type: object
      required: [server_id, collector_epoch, sequence, observed_at, received_at, values]
      properties:
        server_id: { type: string }
        collector_epoch: { type: string }
        sequence: { $ref: '#/components/schemas/DecimalUint64' }
        observed_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        timestamp_uncertainty: { type: string, enum: [none, source-clock-ahead, receipt-clock-ahead, unknown] }
        values: { type: object, additionalProperties: { type: number } }
        counters: { type: object, additionalProperties: { $ref: '#/components/schemas/DecimalUint64' } }
        units: { type: object, additionalProperties: { type: string, maxLength: 32 } }
        validity: { type: object, additionalProperties: { type: string, enum: [valid, unavailable, stale, uncertain] } }
    Job:
      type: object
      required: [id, kind, state, revision, idempotency_key, expires_at, progress]
      properties:
        id: { type: string }
        kind: { type: string }
        state: { type: string, enum: [queued, running, cancelling, succeeded, failed, cancelled, recovery-required] }
        revision: { $ref: '#/components/schemas/DecimalUint64' }
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        target_server_id: { type: string }
        expires_at: { type: string, format: date-time }
        cancel_requested: { type: boolean }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { $ref: '#/components/schemas/APIError' }
    CancelJobRequest:
      type: object
      required: [idempotency_key, expected_revision]
      properties:
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        expected_revision: { $ref: '#/components/schemas/DecimalUint64' }
    CoverageGap:
      type: object
      required: [collector_epoch, from_sequence, to_sequence, reason]
      properties:
        collector_epoch: { type: string, minLength: 1, maxLength: 128 }
        from_sequence: { $ref: '#/components/schemas/DecimalUint64' }
        to_sequence: { $ref: '#/components/schemas/DecimalUint64' }
        reason: { type: string, enum: [spool-eviction, transport-disconnect, out-of-order, retention] }
    EnrollmentRequest:
      type: object
      required: [token, idempotency_key]
      properties: { token: { type: string, minLength: 16, maxLength: 256 }, idempotency_key: { type: string, minLength: 1, maxLength: 128 } }
    TrafficQuery:
      type: object
      required: [periods]
      properties: { periods: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/TrafficPeriod' } }, next_cursor: { type: string, maxLength: 256 } }
    TrafficPeriod:
      type: object
      required: [scope, from, to, timezone, allowance_bytes, direction, counted_bytes, continuity]
      properties: { scope: { type: string, maxLength: 128 }, interfaces: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } }, from: { type: string, format: date-time }, to: { type: string, format: date-time }, timezone: { type: string, maxLength: 64 }, allowance_bytes: { $ref: '#/components/schemas/DecimalUint64' }, direction: { type: string, enum: [inbound, outbound, combined] }, counted_bytes: { $ref: '#/components/schemas/DecimalUint64' }, continuity: { type: string, enum: [complete, gap, uncertain] } }
    TrafficAllowanceRequest:
      type: object
      required: [idempotency_key, expected_revision, scope, allowance_bytes, direction]
      properties: { idempotency_key: { type: string, minLength: 1, maxLength: 128 }, expected_revision: { $ref: '#/components/schemas/DecimalUint64' }, scope: { type: string, maxLength: 128 }, interfaces: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } }, reset_day: { type: integer, minimum: 1, maximum: 31, default: 1 }, timezone: { type: string, maxLength: 64, default: UTC }, allowance_bytes: { $ref: '#/components/schemas/DecimalUint64' }, warning_percentages: { type: array, maxItems: 8, items: { type: integer, minimum: 1, maximum: 100 } }, direction: { type: string, enum: [inbound, outbound, combined] }, start_new_period: { type: boolean, default: false } }
    TrafficAllowance:
      type: object
      required: [scope, direction, allowance_bytes, reset_day, timezone]
      properties: { scope: { type: string, maxLength: 128 }, interfaces: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } }, direction: { type: string, enum: [inbound, outbound, combined] }, allowance_bytes: { $ref: '#/components/schemas/DecimalUint64' }, reset_day: { type: integer, minimum: 1, maximum: 31 }, timezone: { type: string, maxLength: 64 }, warning_percentages: { type: array, maxItems: 8, items: { type: integer, minimum: 1, maximum: 100 } } }
    TrafficConfigurationResult:
      type: object
      required: [allowance, period, configuration_revision]
      properties: { allowance: { $ref: '#/components/schemas/TrafficAllowance' }, period: { $ref: '#/components/schemas/TrafficPeriod' }, preview: { $ref: '#/components/schemas/TrafficPeriodPreview' }, configuration_revision: { $ref: '#/components/schemas/DecimalUint64' } }
    TrafficPeriodPreview:
      type: object
      required: [current, proposed, allowance_effect, schedule_effect, starts_at]
      properties: { current: { $ref: '#/components/schemas/TrafficPeriod' }, proposed: { $ref: '#/components/schemas/TrafficPeriod' }, allowance_effect: { type: string, maxLength: 64 }, schedule_effect: { type: string, maxLength: 64 }, starts_at: { type: string, format: date-time } }
    TrafficForecast:
      type: object
      required: [available, as_of, period_end, observed_bytes, estimated_bytes_at_end, estimated_remaining_bytes, usable_duration_seconds, coverage]
      properties: { available: { type: boolean }, label: { type: string, maxLength: 64 }, reason: { type: string, maxLength: 128 }, as_of: { type: string, format: date-time }, period_end: { type: string, format: date-time }, observed_bytes: { $ref: '#/components/schemas/DecimalUint64' }, estimated_bytes_at_end: { $ref: '#/components/schemas/DecimalUint64' }, estimated_remaining_bytes: { $ref: '#/components/schemas/DecimalUint64' }, usable_duration_seconds: { type: integer, minimum: 0 }, coverage: { type: number, minimum: 0, maximum: 1 } }
    LogSource:
      type: object
      required: [id, label]
      properties: { id: { type: string, maxLength: 128 }, label: { type: string, maxLength: 256 } }
    LogSourcePage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/LogSource' } }, next_cursor: { type: string, maxLength: 256 } }
    LogQuery:
      type: object
      required: [entries]
      properties: { entries: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/LogEntry' } }, next_cursor: { type: string, maxLength: 256 }, truncated: { type: boolean } }
    LogEntry:
      type: object
      required: [source_id, cursor, timestamp, text]
      properties: { source_id: { type: string, maxLength: 128 }, cursor: { type: string, maxLength: 256 }, timestamp: { type: string, format: date-time }, severity: { type: string, maxLength: 32 }, text: { type: string, maxLength: 65536 }, truncated: { type: boolean }, redacted: { type: boolean } }
    LiveLogEvent:
      type: object
      required: [entry, sequence]
      properties: { entry: { $ref: '#/components/schemas/LogEntry' }, sequence: { $ref: '#/components/schemas/DecimalUint64' }, dropped_events: { type: integer, minimum: 0, maximum: 10000 } }
    AlertRuleRequest:
      type: object
      required: [name, expression, idempotency_key]
      properties: { name: { type: string, minLength: 1, maxLength: 128 }, expression: { type: string, minLength: 1, maxLength: 1024 }, idempotency_key: { type: string, minLength: 1, maxLength: 128 }, server_id: { type: string, maxLength: 128 }, enabled: { type: boolean, default: true }, duration_seconds: { type: integer, minimum: 1, maximum: 86400, default: 300 }, recovery_threshold: { type: number }, reminder_seconds: { type: integer, minimum: 0, maximum: 604800, default: 3600 }, group_key: { type: string, maxLength: 128 } }
    AlertRuleUpdateRequest:
      type: object
      minProperties: 1
      properties: { name: { type: string, minLength: 1, maxLength: 128 }, expression: { type: string, minLength: 1, maxLength: 1024 }, idempotency_key: { type: string, minLength: 1, maxLength: 128 }, enabled: { type: boolean }, duration_seconds: { type: integer, minimum: 1, maximum: 86400 }, recovery_threshold: { type: number }, reminder_seconds: { type: integer, minimum: 0, maximum: 604800 }, group_key: { type: string, maxLength: 128 } }
    AlertRule:
      allOf: [{ $ref: '#/components/schemas/AlertRuleRequest' }, { type: object, required: [id, created_at, effective_at], properties: { id: { type: string, maxLength: 128 }, created_at: { type: string, format: date-time }, effective_at: { type: string, format: date-time } } }]
    AlertRulePage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AlertRule' } }, next_cursor: { type: string, maxLength: 256 } }
    AlertState:
      type: object
      required: [id, rule_id, state]
      properties: { id: { type: string, maxLength: 128 }, rule_id: { type: string, maxLength: 128 }, server_id: { type: string, maxLength: 128 }, state: { type: string, enum: [pending, firing, recovered] }, pending_since: { type: string, format: date-time }, firing_since: { type: string, format: date-time }, recovered_at: { type: string, format: date-time }, last_observation: { type: string, format: date-time }, last_value: { type: number }, last_notified_at: { type: string, format: date-time }, incident_id: { type: string, maxLength: 128 }, precision_warning: { type: string, maxLength: 256 } }
    AlertStatePage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AlertState' } }, next_cursor: { type: string, maxLength: 256 } }
    AlertHistoryQuery:
      type: object
      required: [events]
      properties: { events: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AlertHistoryEvent' } }, next_cursor: { type: string, maxLength: 256 } }
    AlertHistoryEvent:
      type: object
      required: [id, alert_id, state, occurred_at]
      properties: { id: { type: string, maxLength: 128 }, alert_id: { type: string, maxLength: 128 }, server_id: { type: string, maxLength: 128 }, state: { type: string, enum: [pending, firing, recovered, suppressed] }, occurred_at: { type: string, format: date-time }, reason: { type: string, maxLength: 512 }, value: { type: number }, incident_id: { type: string, maxLength: 128 } }
    MaintenanceWindowRequest:
      type: object
      required: [idempotency_key, starts_at, ends_at]
      properties: { idempotency_key: { type: string, minLength: 1, maxLength: 128 }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, server_ids: { type: array, maxItems: 20, items: { type: string } }, reason: { type: string, maxLength: 512 } }
    MaintenanceWindow:
      allOf: [{ $ref: '#/components/schemas/MaintenanceWindowRequest' }, { type: object, required: [id], properties: { id: { type: string, maxLength: 128 } } }]
    MaintenanceWindowPage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/MaintenanceWindow' } }, next_cursor: { type: string, maxLength: 256 } }
    IncidentSnapshot:
      type: object
      required: [id, state, started_at, summary, evidence]
      properties: { id: { type: string, maxLength: 128 }, server_id: { type: string, maxLength: 128 }, group_key: { type: string, maxLength: 128 }, state: { type: string, enum: [open, recovered] }, started_at: { type: string, format: date-time }, ended_at: { type: string, format: date-time }, summary: { type: string, maxLength: 512 }, events: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AlertHistoryEvent' } }, evidence: { type: array, maxItems: 200, items: { type: string, maxLength: 4096 } }, truncated: { type: boolean } }
    Module:
      type: object
      required: [id, version, signing_key_id]
      properties: { id: { type: string, maxLength: 128 }, version: { type: string, maxLength: 64 }, signing_key_id: { type: string, maxLength: 128 }, capabilities: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } } }
    ModulePage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Module' } }, next_cursor: { type: string, maxLength: 256 } }
    ModuleInstallation:
      type: object
      required: [module_id, version, state]
      properties: { module_id: { type: string, maxLength: 128 }, version: { type: string, maxLength: 64 }, state: { type: string, enum: [unavailable, available, downloading, verifying, installing, installed-disabled, enabled, updating, removing, failed] } }
    ModuleInstallationPage:
      type: object
      required: [items]
      properties: { items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ModuleInstallation' } }, next_cursor: { type: string, maxLength: 256 } }
    ModuleJobRequest:
      type: object
      required: [module_id, idempotency_key, expected_revision]
