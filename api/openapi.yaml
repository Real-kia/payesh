    patch:
      operationId: updateSettings
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsRequest' } } } }
      responses: { '200': { description: Settings updated, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /settings/https:
    get:
      operationId: getHTTPSSettings
      summary: Dashboard domain and automatic certificate state
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: HTTPS state, content: { application/json: { schema: { $ref: '#/components/schemas/HTTPSStatus' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    put:
      operationId: setHTTPSDomain
      summary: Set the dashboard domain and request a Let's Encrypt certificate in the background
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HTTPSSettingsRequest' } } } }
      responses: { '202': { description: Certificate request started; poll GET for the result, content: { application/json: { schema: { $ref: '#/components/schemas/HTTPSStatus' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
    patch:
      operationId: changeDashboardPort
      summary: Reserve and persist a dashboard port while retaining node endpoints
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              additionalProperties: false
              properties:
                port: { type: integer, minimum: 1, maximum: 65535 }
      responses:
        '200': { description: Port changed, content: { application/json: { schema: { $ref: '#/components/schemas/HTTPSStatus' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeHTTPSDomain
      summary: Remove the domain and certificate; the dashboard returns to plain HTTP
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      responses: { '204': { description: Domain removed }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /backups:
    get:
      operationId: listBackups
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Backup records, content: { application/json: { schema: { $ref: '#/components/schemas/BackupPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createBackup
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BackupRequest' } } } }
      responses: { '202': { description: Backup job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /backups/export:
    post:
      operationId: exportBackup
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExportRequest' } } } }
      responses: { '202': { description: Protected export job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /backups/import:
    post:
      operationId: importBackup
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } } } }
      responses: { '202': { description: Verified import job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /role-transitions:
    post:
      operationId: startRoleTransition
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleTransitionRequest' } } } }
      responses: { '202': { description: Preflighted role-transition job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /audit-events:
    get:
      operationId: listAuditEvents
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { name: target_id, in: query, schema: { type: string, maxLength: 128 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Redacted audit-event page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: payesh_session
      description: Secure, HttpOnly, SameSite session cookie.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Per-session token required on browser-originated mutations.
  parameters:
    ServerID:
      name: serverId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
    From:
      name: from
      in: query
      required: true
      description: UTC start; range must be no longer than 31 days.
      schema: { type: string, format: date-time }
      x-max-duration: P31D
    To:
      name: to
      in: query
      required: true
      description: UTC end; range must be no longer than 31 days.
      schema: { type: string, format: date-time }
      x-max-duration: P31D
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable operation identity used for safe retries.
      schema: { type: string, minLength: 1, maxLength: 128 }
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token issued with the authenticated session.
      schema: { type: string, minLength: 16, maxLength: 256 }
    ModuleID:
      name: moduleId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PolicyID:
      name: policyId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    TargetKind:
      name: targetKind
      in: path
      required: true
      schema: { type: string, enum: [service, process-group] }
    BandwidthTargetKind:
      name: bandwidthTargetKind
      in: path
      required: true
      schema: { type: string, enum: [interface, local-port] }
    TargetName:
      name: targetName
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    Forbidden: { description: CSRF token or owner authorization rejected, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    Conflict: { description: State or revision conflict, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    ServiceUnavailable: { description: 'The source or derived data is temporarily unavailable; retry later.', content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } } }
    TooManyRequests:
      description: 'Login attempts are throttled. The API error uses code auth.rate_limited and retryable true.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/json: { schema: { $ref: '#/components/schemas/APIError' } } }
  headers:
    RetryAfter:
      description: Whole seconds to wait before the next login attempt.
      schema: { type: integer, minimum: 1, maximum: 3600 }
  schemas:
    ProcessSnapshot:
      type: object
      required: [sampled_at, interval_seconds, total, matched, truncated, network_accounting, items]
      properties:
        sampled_at: { type: string, format: date-time }
        interval_seconds: { type: number, minimum: 0 }
        total: { type: integer, minimum: 0 }
        matched: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        network_accounting: { type: string, enum: [connections-only] }
