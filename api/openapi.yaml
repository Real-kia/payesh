openapi: 3.0.3
info:
  title: Payesh API
  version: 0.1.0-foundation
  description: |
    Versioned REST contract for Payesh. Foundation endpoints are specified
    here; implementation is intentionally deferred to later milestones.
servers:
  - url: /api/v1
x-max-request-bytes: 1048576
x-max-response-bytes: 1048576
x-pagination-max-items: 200
paths:
  /setup:
    post:
      operationId: completeSetup
      summary: Consume the one-time setup secret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201': { description: Owner account created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /session:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: Session cookie established }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: logout
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '204': { description: Session expired }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /servers:
    get:
      operationId: listServers
      security:
        - SessionCookie: []
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses:
        '200':
          description: Known servers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /servers/{serverId}:
    parameters:
      - $ref: '#/components/parameters/ServerID'
    get:
      operationId: getServer
      security:
        - SessionCookie: []
      responses:
        '200': { description: Server detail, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateServerLabel
      summary: Rename a server without changing its stable identity
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerLabelUpdateRequest' }
      responses:
        '200': { description: Server label updated, content: { application/json: { schema: { $ref: '#/components/schemas/Server' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /servers/{serverId}/metrics:
    parameters:
      - $ref: '#/components/parameters/ServerID'
    get:
      operationId: queryMetrics
      security:
        - SessionCookie: []
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: resolution, in: query, schema: { type: string, enum: [raw, minute, hour] } }
        - { name: limit, in: query, description: 'Maximum samples returned.', schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: cursor, in: query, description: 'Opaque pagination cursor.', schema: { type: string, maxLength: 256 } }
        - { name: gaps_cursor, in: query, description: 'Opaque coverage-gap pagination cursor.', schema: { type: string, maxLength: 256 } }
      responses:
        '200': { description: Metric samples and coverage, content: { application/json: { schema: { $ref: '#/components/schemas/MetricQuery' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    get:
      operationId: getJob
      security:
        - SessionCookie: []
      responses:
        '200': { description: Durable job state, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: cancelJob
      summary: Request cancellation of a cancellable job
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelJobRequest' }
      responses:
        '202': { description: Cancellation recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /servers/{serverId}/enrollment:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    post:
      operationId: enrollServer
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentRequest' } } } }
      responses: { '202': { description: Enrollment job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      operationId: revokeServer
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CSRFHeader' }]
      responses: { '202': { description: Revocation job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /servers/{serverId}/traffic:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: queryTraffic
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { name: scope, in: query, schema: { type: string, maxLength: 128 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Traffic periods, content: { application/json: { schema: { $ref: '#/components/schemas/TrafficQuery' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: configureTrafficAllowance
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TrafficAllowanceRequest' } } } }
      responses: { '200': { description: Durable traffic configuration and active-period preview, content: { application/json: { schema: { $ref: '#/components/schemas/TrafficConfigurationResult' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /servers/{serverId}/traffic/forecast:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: forecastTraffic
      security: [{ SessionCookie: [] }]
      parameters: [{ name: scope, in: query, required: true, schema: { type: string, maxLength: 128 } }, { name: direction, in: query, required: true, schema: { type: string, enum: [inbound, outbound, combined] } }, { name: as_of, in: query, schema: { type: string, format: date-time } }]
      responses: { '200': { description: Labelled host-side recent-rate traffic estimate, content: { application/json: { schema: { $ref: '#/components/schemas/TrafficForecast' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /servers/{serverId}/logs/sources:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: listLogSources
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Allowed log sources, content: { application/json: { schema: { $ref: '#/components/schemas/LogSourcePage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /servers/{serverId}/logs:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: queryLogs
      security: [{ SessionCookie: [] }]
      parameters: [{ name: source, in: query, required: true, schema: { type: string, maxLength: 128 } }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { name: severity, in: query, schema: { type: string, maxLength: 32 } }, { name: search, in: query, schema: { type: string, maxLength: 256 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Bounded log page, content: { application/json: { schema: { $ref: '#/components/schemas/LogQuery' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /servers/{serverId}/logs/live:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: tailLogs
      security: [{ SessionCookie: [] }]
      parameters: [{ name: source, in: query, required: true, schema: { type: string, maxLength: 128 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }, { name: max_events, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }, { name: max_bytes, in: query, schema: { type: integer, minimum: 1024, maximum: 1048576, default: 262144 } }, { name: max_duration_seconds, in: query, schema: { type: integer, minimum: 1, maximum: 300, default: 30 } }]
      responses: { '200': { description: Bounded live-log event stream for registered file or journald sources, content: { application/x-ndjson: { schema: { $ref: '#/components/schemas/LiveLogEvent' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /alerts/rules:
    get:
      operationId: listAlertRules
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Alert rules, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRulePage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createAlertRule
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleRequest' } } } }
      responses: { '201': { description: Rule created, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /alerts/rules/{ruleId}:
    parameters: [{ name: ruleId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
    patch:
      operationId: updateAlertRule
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleUpdateRequest' } } } }
      responses: { '200': { description: Rule updated, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    put:
      operationId: replaceAlertRule
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleUpdateRequest' } } } }
      responses: { '200': { description: Rule replaced, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /alerts:
    get:
      operationId: listAlerts
      security: [{ SessionCookie: [] }]
      parameters: [{ name: server_id, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Alert states, content: { application/json: { schema: { $ref: '#/components/schemas/AlertStatePage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /alerts/history:
    get:
      operationId: queryAlertHistory
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Alert history page, content: { application/json: { schema: { $ref: '#/components/schemas/AlertHistoryQuery' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /maintenance-windows:
    get:
      operationId: listMaintenanceWindows
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Scheduled maintenance windows, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceWindowPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createMaintenanceWindow
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceWindowRequest' } } } }
      responses: { '201': { description: Maintenance window created, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceWindow' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /incidents/{incidentId}:
    parameters: [{ name: incidentId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }]
    get:
      operationId: getIncident
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: Incident snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/IncidentSnapshot' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /modules:
    get:
      operationId: listModules
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Signed module catalog, content: { application/json: { schema: { $ref: '#/components/schemas/ModulePage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /servers/{serverId}/modules:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: listServerModules
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Module installations, content: { application/json: { schema: { $ref: '#/components/schemas/ModuleInstallationPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: installModule
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModuleJobRequest' } } } }
      responses: { '202': { description: Module job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /servers/{serverId}/modules/{moduleId}/enable:
    parameters: [{ $ref: '#/components/parameters/ServerID' }, { $ref: '#/components/parameters/ModuleID' }]
    post:
      operationId: enableModule
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModuleLifecycleRequest' } } } }
      responses: { '202': { description: Module lifecycle job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /servers/{serverId}/modules/{moduleId}/disable:
    parameters: [{ $ref: '#/components/parameters/ServerID' }, { $ref: '#/components/parameters/ModuleID' }]
    post:
      operationId: disableModule
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModuleLifecycleRequest' } } } }
      responses: { '202': { description: Module lifecycle job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /servers/{serverId}/modules/{moduleId}/remove:
    parameters: [{ $ref: '#/components/parameters/ServerID' }, { $ref: '#/components/parameters/ModuleID' }]
    post:
      operationId: removeModule
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModuleLifecycleRequest' } } } }
      responses: { '202': { description: Module removal job; active policies are reverted before removal, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /servers/{serverId}/policies:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: listPolicies
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Control policies, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: applyPolicy
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyRequest' } } } }
      responses: { '202': { description: Policy job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /servers/{serverId}/policies/preview:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    post:
      operationId: previewPolicy
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyPreviewRequest' } } } }
      responses: { '200': { description: Policy safety preview, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyPreview' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /servers/{serverId}/policies/{policyId}/effective:
    parameters: [{ $ref: '#/components/parameters/ServerID' }, { $ref: '#/components/parameters/PolicyID' }]
    get:
      operationId: getEffectivePolicyState
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: Effective policy state, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyEffectiveState' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /servers/{serverId}/policies/{policyId}/revert:
    parameters: [{ $ref: '#/components/parameters/ServerID' }, { $ref: '#/components/parameters/PolicyID' }]
    post:
      operationId: revertPolicy
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyRevertRequest' } } } }
      responses: { '202': { description: Revert job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /releases:
    get:
      operationId: listReleases
      security: [{ SessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }, { name: cursor, in: query, schema: { type: string, maxLength: 256 } }]
      responses: { '200': { description: Verified release metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /updates:
    post:
      operationId: startUpdate
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRequest' } } } }
      responses: { '202': { description: Update job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /updates/preflight:
    post:
      operationId: preflightUpdate
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePreflightRequest' } } } }
      responses: { '200': { description: Per-machine compatibility and headroom results, content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePreflight' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /settings:
    get:
      operationId: getSettings
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: Owner settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
    patch:
      operationId: updateSettings
      security: [{ SessionCookie: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsRequest' } } } }
      responses: { '200': { description: Settings updated, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /backups:
