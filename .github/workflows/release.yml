name: release

# Pushing a tag such as v0.1.0 builds the Linux release bundle and publishes it
# as a GitHub Release. install.sh downloads its files from that release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: make web-check
      - name: Build release bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            go run ./scripts/release-package -version "$version"
          make release-validate RELEASE_VERSION="$version"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Payesh $VERSION" --generate-notes \
            dist/releases/"$VERSION"/*
