name: release

# Pushing a tag such as v0.1.0 builds the Linux release bundle and publishes it
# as a GitHub Release. install.sh downloads its files from that release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: make web-check
      - name: Verify process module and API
        run: go test -race ./internal/processmonitor ./internal/modules ./internal/fleet
      - name: Build release bundle
        env:
          PAYESH_RELEASE_MIN_CORE: ${{ vars.PAYESH_RELEASE_MIN_CORE }}
        run: |
          test -n "$PAYESH_RELEASE_MIN_CORE" || { echo "Configure the reviewed PAYESH_RELEASE_MIN_CORE repository variable before release packaging" >&2; exit 2; }
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            go run ./scripts/release-package -version "$version"
          make release-validate RELEASE_VERSION="$version"
      - name: Include immutable signed process package
        if: github.ref_name != 'v0.2.11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.11 --repo Real-kia/payesh \
            --pattern 'process-monitoring-linux-*' --dir "dist/releases/$VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Payesh $VERSION" --generate-notes \
            dist/releases/"$VERSION"/*
